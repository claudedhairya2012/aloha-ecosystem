<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aloha Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-chrome: #0a0c0e;
      --bg-toolbar: #121518;
      --bg-page: #08090a;
      --bg-card: #171a1e;
      --bg-input: #1e2227;
      --border: #282c34;
      --border-hover: #3b82f6;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-page);
      color: var(--text);
      font-family: var(--sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* =====================================================================
       1. BROWSER TAB STRIP
       ===================================================================== */
    .tab-strip {
      background: var(--bg-chrome);
      height: 42px;
      display: flex;
      align-items: flex-end;
      padding: 0 8px;
      gap: 3px;
      border-bottom: 1px solid var(--border);
      user-select: none;
      overflow-x: auto;
    }
    .tab-strip::-webkit-scrollbar { height: 0px; }
    .browser-tab {
      background: transparent;
      color: var(--muted);
      height: 34px;
      min-width: 170px;
      max-width: 240px;
      padding: 0 14px;
      border-radius: 9px 9px 0 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      border-bottom: none;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .browser-tab:hover { background: rgba(255, 255, 255, 0.04); color: var(--text); }
    .browser-tab.active { background: var(--bg-toolbar); color: var(--text); border-color: var(--border); font-weight: 600; }
    .tab-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .tab-close {
      width: 18px; height: 18px; border-radius: 4px; display: inline-flex;
      align-items: center; justify-content: center; font-size: 0.85rem; color: var(--muted);
    }
    .tab-close:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .new-tab-btn {
      height: 30px; width: 30px; border-radius: 7px; border: none; background: transparent;
      color: var(--muted); font-size: 1.2rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center; margin-bottom: 2px; flex-shrink: 0;
    }
    .new-tab-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }

    /* =====================================================================
       2. NAV TOOLBAR
       ===================================================================== */
    .nav-toolbar {
      background: var(--bg-toolbar);
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .nav-icon-btn {
      width: 34px; height: 34px; border-radius: 7px; border: none; background: transparent;
      color: var(--text); font-size: 1rem; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: background 0.15s;
    }
    .nav-icon-btn:hover:not(:disabled) { background: rgba(255, 255, 255, 0.08); }
    .nav-icon-btn:disabled { color: #4b5563; cursor: default; }

    .omnibar-wrap {
      flex: 1; height: 38px; background: var(--bg-input); border: 1px solid var(--border);
      border-radius: 999px; display: flex; align-items: center; padding: 0 16px;
      gap: 10px; transition: border-color 0.15s;
    }
    .omnibar-wrap:focus-within { border-color: var(--accent); background: #15181c; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .omnibar-input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 0.9rem; outline: none; font-family: var(--sans); }

    .toolbar-actions { display: flex; align-items: center; gap: 8px; }
    .tool-pill {
      height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg-card); color: var(--text); font-size: 0.78rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: var(--mono);
      white-space: nowrap; transition: border-color 0.15s, transform 0.1s;
    }
    .tool-pill:hover { border-color: var(--accent); color: var(--accent); }

    /* =====================================================================
       3. VIEWPORT
       ===================================================================== */
    .viewport { flex: 1; overflow-y: auto; position: relative; }

    .newtab-view {
      min-height: calc(100vh - 94px); display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .google-logo {
      font-size: 3.5rem; font-weight: 800; letter-spacing: -2px;
      margin-bottom: 32px; color: var(--text);
    }
    .center-search-box {
      width: 100%; max-width: 660px; height: 52px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 999px; display: flex;
      align-items: center; padding: 0 20px; gap: 14px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45); transition: border-color 0.15s;
    }
    .center-search-box:focus-within { border-color: var(--accent); box-shadow: 0 8px 35px rgba(59, 130, 246, 0.2); }
    .center-search-input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 1.02rem; outline: none; }

    .search-results-container { max-width: 980px; margin: 0 auto; padding: 28px 24px; }
    .filter-bar {
      display: flex; gap: 8px; border-bottom: 1px solid var(--border);
      padding-bottom: 14px; margin-bottom: 22px; overflow-x: auto;
    }
    .filter-btn {
      background: transparent; border: 1px solid transparent; color: var(--muted);
      padding: 7px 14px; border-radius: 7px; font-size: 0.82rem; font-weight: 500;
      cursor: pointer; white-space: nowrap;
    }
    .filter-btn.active { background: var(--bg-card); border-color: var(--border); color: var(--text); font-weight: 600; }
    .result-item {
      padding: 18px 0; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 18px;
    }
    .result-meta {
      font-family: var(--mono); font-size: 0.74rem; color: var(--muted);
      margin-bottom: 6px; display: flex; align-items: center; gap: 10px;
    }
    .source-tag {
      background: var(--bg-input); border: 1px solid var(--border); color: var(--accent);
      padding: 3px 8px; border-radius: 5px; font-size: 0.68rem; font-weight: 600;
    }
    .result-title {
      font-size: 1.12rem; font-weight: 600; color: #60a5fa;
      cursor: pointer; margin-bottom: 6px; display: inline-block;
    }
    .result-title:hover { text-decoration: underline; }
    .result-snippet { font-size: 0.9rem; color: #d1d5db; line-height: 1.55; }
    .split-open-btn {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text);
      padding: 9px 14px; border-radius: 7px; font-size: 0.78rem; font-family: var(--mono);
      font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: all 0.15s;
    }
    .split-open-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* =====================================================================
       4. SPLIT-SCREEN
       ===================================================================== */
    .split-screen { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 94px); width: 100%; }
    .split-pane { display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .split-pane.left { border-right: 1px solid var(--border); }
    .pane-header {
      height: 46px; background: var(--bg-card); border-bottom: 1px solid var(--border);
      padding: 0 18px; display: flex; align-items: center; justify-content: space-between;
      font-family: var(--mono); font-size: 0.78rem; flex-shrink: 0;
    }
    .pane-body {
      flex: 1; overflow-y: auto; padding: 20px; font-family: var(--mono);
      font-size: 0.84rem; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
    }
    .human-bloat-banner {
      background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.78rem;
    }
    .aloha-clean-banner {
      background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px;
      font-size: 0.78rem; display: flex; justify-content: space-between; align-items: center;
    }

    /* =====================================================================
       5. HOLOGRAPHIC PASSPORT MODAL
       ===================================================================== */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78);
      display: none; align-items: center; justify-content: center; z-index: 600; padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: var(--bg-toolbar); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 600px; padding: 26px; }
    .holo-stage { perspective: 1000px; margin: 18px 0; }
    .holo-card {
      position: relative; border-radius: 18px; padding: 28px;
      background: linear-gradient(135deg, #181c22 0%, #0c0e12 100%);
      border: 1.5px solid #374151; box-shadow: 0 25px 60px rgba(0,0,0,0.65);
      transform-style: preserve-3d; transition: transform 0.1s ease-out;
      overflow: hidden; cursor: grab;
    }
    .holo-glare {
      position: absolute; inset: 0;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,0.2), rgba(59,130,246,0.15) 35%, transparent 65%);
      pointer-events: none;
    }
    .holo-chip { width: 48px; height: 34px; border-radius: 7px; background: linear-gradient(135deg, #eab308, #a16207); margin-bottom: 20px; }
    .holo-number {
      font-family: var(--mono); font-size: 1.75rem; font-weight: 800; letter-spacing: 2px;
      color: #fff; margin: 8px 0 20px; text-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }

    input.form-in, select.form-in, textarea.form-in {
      width: 100%; background: var(--bg-input); border: 1px solid var(--border);
      color: var(--text); padding: 11px 14px; border-radius: 8px;
      font-family: var(--sans); font-size: 0.9rem; margin-top: 6px; margin-bottom: 14px; outline: none;
    }
    .btn-primary { background: var(--text); color: #000; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.86rem; cursor: pointer; }
    .btn-secondary { background: var(--bg-input); color: var(--text); border: 1px solid var(--border); padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 0.86rem; cursor: pointer; }

    /* =====================================================================
       6. GMAIL-STYLE MAIL CLIENT
       ===================================================================== */
    .gmail-layout {
      display: grid;
      grid-template-columns: 240px 380px 1fr;
      height: calc(100vh - 94px);
      overflow: hidden;
    }
    .gmail-sidebar {
      background: var(--bg-toolbar);
      border-right: 1px solid var(--border);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .compose-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 18px;
      transition: background 0.15s;
    }
    .compose-btn:hover { background: #2563eb; }
    .folder-nav { display: flex; flex-direction: column; gap: 2px; }
    .folder-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 20px 2px 2px 20px;
      cursor: pointer;
      font-size: 0.86rem;
      color: var(--text);
      transition: background 0.1s;
    }
    .folder-item:hover { background: rgba(255,255,255,0.04); }
    .folder-item.active {
      background: rgba(59, 130, 246, 0.15);
      font-weight: 700;
      color: var(--accent);
    }
    .folder-icon { font-size: 1rem; }
    .folder-label { flex: 1; }
    .folder-count { font-size: 0.72rem; font-family: var(--mono); color: var(--muted); }
    .folder-item.active .folder-count { color: var(--accent); }
    .sidebar-section { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--border); }
    .section-title {
      font-size: 0.68rem;
      font-family: var(--mono);
      color: var(--muted);
      padding: 0 14px 6px;
      letter-spacing: 1px;
    }
    .label-item {
      padding: 6px 14px;
      font-size: 0.78rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .label-item:hover { background: rgba(255,255,255,0.03); }
    .sidebar-footer {
      margin-top: auto;
      padding: 12px 14px;
      border-top: 1px solid var(--border);
    }

    .gmail-list {
      background: var(--bg-page);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .list-header { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .mail-search {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      outline: none;
    }
    .mail-search:focus { border-color: var(--accent); }
    .list-toolbar {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
    }
    .message-list { flex: 1; overflow-y: auto; }
    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }
    .message-row:hover { background: rgba(255,255,255,0.03); }
    .message-row.active { background: rgba(59, 130, 246, 0.12); }
    .message-row.unread { background: rgba(255,255,255,0.02); }
    .message-row.unread .msg-from, .message-row.unread .msg-subject { font-weight: 700; color: #fff; }
    .star-icon { font-size: 1rem; cursor: pointer; margin-top: 2px; }
    .msg-body-preview { flex: 1; min-width: 0; }
    .msg-top-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .msg-from { font-size: 0.82rem; color: var(--text); font-weight: 500; }
    .msg-date { font-size: 0.7rem; color: var(--muted); font-family: var(--mono); }
    .msg-subject-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 3px; }
    .msg-subject { font-size: 0.84rem; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .msg-preview { font-size: 0.74rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tone-tag {
      font-size: 0.62rem;
      font-family: var(--mono);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .tone-formal { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
    .tone-informal { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }
    .tone-intent { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
    .tone-malicious { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }

    .gmail-reader {
      background: var(--bg-page);
      padding: 24px;
      overflow-y: auto;
    }
    .reader-header { padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
    .icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      cursor: pointer;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.08); }
    .chip {
      font-size: 0.68rem;
      font-family: var(--mono);
      padding: 3px 8px;
      border-radius: 12px;
      font-weight: 700;
    }
    .chip-high { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
    .chip-normal { background: rgba(245, 158, 11, 0.15); color: #fcd34d; }
    .chip-low { background: rgba(156, 163, 175, 0.15); color: #d1d5db; }
    .chip-blocked { background: rgba(239, 68, 68, 0.3); color: #fff; }
    .chip-tone { background: rgba(59, 130, 246, 0.15); color: #93c5fd; }
    .chip-verified { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; }
    .reader-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 0;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    .reader-body {
      font-size: 0.92rem;
      line-height: 1.7;
      color: #e5e7eb;
      white-space: pre-wrap;
      font-family: var(--mono);
      padding: 18px 0;
    }
    .reader-actions { display: flex; gap: 10px; padding-top: 14px; border-top: 1px solid var(--border); }

    .compose-window {
      position: fixed;
      bottom: 0;
      right: 24px;
      width: 560px;
      max-height: 85vh;
      background: var(--bg-toolbar);
      border: 1px solid var(--border);
      border-radius: 10px 10px 0 0;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.6);
      z-index: 500;
      display: flex;
      flex-direction: column;
    }
    .compose-header {
      background: var(--bg-card);
      padding: 10px 14px;
      border-radius: 10px 10px 0 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .compose-body { padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    .compose-row { display: flex; flex-direction: column; gap: 4px; }
    .compose-row-split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .compose-row label, .compose-row-split label {
      font-size: 0.68rem;
      font-family: var(--mono);
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    @media (max-width: 1100px) {
      .gmail-layout { grid-template-columns: 70px 320px 1fr; }
      .folder-label, .section-title, .label-item span:last-child, .sidebar-footer { display: none; }
      .folder-item { justify-content: center; }
    }
    @media (max-width: 900px) {
      .split-screen { grid-template-columns: 1fr; height: auto; }
      .split-pane { height: 50vh; }
    }
  </style>
</head>
<body>

  <div class="tab-strip" id="tabStrip"></div>

  <div class="nav-toolbar">
    <button class="nav-icon-btn" id="btnBack" onclick="goBack()" title="Back">←</button>
    <button class="nav-icon-btn" id="btnForward" onclick="goForward()" title="Forward">→</button>
    <button class="nav-icon-btn" onclick="reloadCurrentTab()" title="Refresh">↻</button>
    <button class="nav-icon-btn" onclick="goHomeClean()" title="New Search Home">🏠</button>

    <div class="omnibar-wrap">
      <input
        type="text"
        id="omnibarInput"
        class="omnibar-input"
        placeholder="Search or enter web address"
        onkeydown="if(event.key==='Enter') handleOmnibarSubmit(this.value)"
      />
    </div>

    <div class="toolbar-actions">
      <button class="tool-pill" onclick="openMailTab()" title="15-Digit Aloha Mail">
        ✉️ Mail (<span id="mailBadgeCount">3</span>)
      </button>
      <button class="tool-pill" onclick="openHubTab()" title=".aloha Bot Websites">
        🤖 .aloha Sites
      </button>
      <button class="tool-pill" onclick="togglePassportModal(true)" id="toolbarAgentId" title="Click to view 3D Holographic Passport">
        🪪 101-84920144-002-6
      </button>
    </div>
  </div>

  <main class="viewport" id="viewport"></main>

  <div class="modal-backdrop" id="passportModal" onclick="if(event.target===this) togglePassportModal(false)">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:1rem;">🪪 3D Holographic 15-Digit Aloha Passport</strong>
        <button class="nav-icon-btn" onclick="togglePassportModal(false)">✕</button>
      </div>
      <p style="font-size:0.82rem; color:var(--muted); margin-top:4px;">
        Move your mouse over the card to tilt in 3D. Replaces @gmail.com for bots with Luhn-validated Ed25519 identity.
      </p>

      <div class="holo-stage">
        <div class="holo-card" id="holoCard" onmousemove="tiltCard(event)" onmouseleave="resetCard()">
          <div class="holo-glare" id="holoGlare"></div>
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div class="holo-chip"></div>
            <span style="font-family:var(--mono); font-size:0.72rem; color:var(--green);">ALOHA-ID-v1 • LUHN VALID</span>
          </div>
          <div style="font-family:var(--mono); font-size:0.7rem; color:var(--muted);">15-DIGIT AGENT NUMBER</div>
          <div class="holo-number" id="cardAgentId">101-84920144-002-6</div>
          <div style="display:flex; justify-content:space-between; font-family:var(--mono); font-size:0.76rem; color:var(--muted);">
            <div>CLASS: <strong style="color:#fff;" id="cardClass">101 (LLM Agent)</strong></div>
            <div>PERM: <strong style="color:#fff;" id="cardCap">002 (READ_WRITE)</strong></div>
          </div>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div>
          <label style="font-size:0.74rem; color:var(--muted); font-family:var(--mono);">AGENT CLASS (1-3)</label>
          <select id="mintClass" class="form-in">

    // =========================================================================

    function createNewTab(initialState = { type: "newtab", title: "New Tab", query: "" }) {
      const id = "tab_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6);
      const newTab = { id, history: [initialState], historyIndex: 0 };
      tabs.push(newTab);
      activeTabId = id;
      renderTabs();
      renderCurrentTabViewport();
    }

    function closeTab(id, event) {
      event.stopPropagation();
      if (tabs.length === 1) { goHomeClean(); return; }
      const idx = tabs.findIndex(t => t.id === id);
      tabs.splice(idx, 1);
      if (activeTabId === id) activeTabId = tabs[Math.max(0, idx - 1)].id;
      renderTabs();
      renderCurrentTabViewport();
    }

    function switchTab(id) {
      activeTabId = id;
      renderTabs();
      renderCurrentTabViewport();
    }

    function getCurrentTab() { return tabs.find(t => t.id === activeTabId); }
    function getCurrentState() { return getCurrentTab().history[getCurrentTab().historyIndex]; }

    function pushTabState(newState) {
      const tab = getCurrentTab();
      tab.history = tab.history.slice(0, tab.historyIndex + 1);
      tab.history.push(newState);
      tab.historyIndex = tab.history.length - 1;
      renderTabs();
      renderCurrentTabViewport();
    }

    function goBack() {
      const tab = getCurrentTab();
      if (tab.historyIndex > 0) { tab.historyIndex--; renderTabs(); renderCurrentTabViewport(); }
    }

    function goForward() {
      const tab = getCurrentTab();
      if (tab.historyIndex < tab.history.length - 1) { tab.historyIndex++; renderTabs(); renderCurrentTabViewport(); }
    }

    function reloadCurrentTab() { renderCurrentTabViewport(); }
    function goHomeClean() { pushTabState({ type: "newtab", title: "New Tab", query: "" }); }

    function renderTabs() {
      const strip = document.getElementById("tabStrip");
      strip.innerHTML = tabs.map(t => {
        const st = t.history[t.historyIndex];
        return `
          <div class="browser-tab ${t.id === activeTabId ? 'active' : ''}" onclick="switchTab('${t.id}')">
            <span class="tab-title">${escapeHtml(st.title || "New Tab")}</span>
            <span class="tab-close" onclick="closeTab('${t.id}', event)">×</span>
          </div>
        `;
      }).join("") + `<button class="new-tab-btn" onclick="createNewTab()" title="New Tab">+</button>`;

      const tab = getCurrentTab();
      document.getElementById("btnBack").disabled = tab.historyIndex <= 0;
      document.getElementById("btnForward").disabled = tab.historyIndex >= tab.history.length - 1;
      document.getElementById("omnibarInput").value = getCurrentState().query || "";
    }

    function renderCurrentTabViewport() {
      const st = getCurrentState();

            url: "aloha://" + alohaHit.domain, snippet: alohaHit.summary, json: alohaHit.json

        });
        return;
      }

      const isUrl = /^https?:\/\//i.test(q) || (/^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(q) && !q.includes(" "));
      if (isUrl) {
        const fullUrl = /^https?:\/\//i.test(q) ? q : "https://" + q;
        pushTabState({
          type: "split", title: fullUrl, query: fullUrl,
          item: { source: "LIVE WEBSITE", title: fullUrl, url: fullUrl, snippet: "Live web scrape & factual extraction.", isLiveUrl: true }

        return;
      }

      pushTabState({ type: "search", title: `${q} - Aloha Search`, query: q, filter: "ALL" });

    // =========================================================================

    async function executeMultiIndexSearch(query, activeFilter = "ALL") {
      const vp = document.getElementById("viewport");
      vp.innerHTML = `
        <div class="search-results-container">
          <div style="color:var(--muted); font-family:var(--mono); font-size:0.82rem;">
            Querying indexes for "${escapeHtml(query)}"...
          </div>
        </div>
      `;

      const wikiUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*&srlimit=4`;
      const openAlexUrl = `https://api.openalex.org/works?search=${encodeURIComponent(query)}&per-page=4`;
      const ghUrl = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&per_page=3`;
      const hnUrl = `https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(query)}&tags=story&hitsPerPage=4`;
      const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;

      const [wikiRes, oaRes, ghRes, hnRes, ddgRes] = await Promise.allSettled([
        fetch(wikiUrl).then(r => r.json()),
        fetch(openAlexUrl).then(r => r.json()),
        fetch(ghUrl).then(r => r.json()),
        fetch(hnUrl).then(r => r.json()),
        fetch(ddgUrl).then(r => r.json())
      ]);

      let results = [];

      alohaSites.forEach(s => {
        if (s.title.toLowerCase().includes(query.toLowerCase()) || s.summary.toLowerCase().includes(query.toLowerCase())) {
          results.push({ category: "ALOHA", source: ".ALOHA BOT SITE", title: `${s.title} (${s.domain})`, url: `aloha://${s.domain}`, snippet: s.summary, json: s.json });
        }
      });

      if (ddgRes.status === "fulfilled" && ddgRes.value?.AbstractText) {
        results.push({ category: "ENCYCLOPEDIA", source: "KNOWLEDGE GRAPH", title: ddgRes.value.Heading || query, url: ddgRes.value.AbstractURL || "https://duckduckgo.com", snippet: ddgRes.value.AbstractText });
      }

      if (wikiRes.status === "fulfilled" && wikiRes.value?.query?.search) {
        wikiRes.value.query.search.forEach(w => {
          results.push({ category: "ENCYCLOPEDIA", source: "WIKIPEDIA", title: w.title, url: `https://en.wikipedia.org/wiki/${encodeURIComponent(w.title.replace(/ /g, "_"))}`, wikiTitle: w.title, snippet: w.snippet.replace(/<\/?[^>]+(>|$)/g, "") });
        });
      }

      if (oaRes.status === "fulfilled" && Array.isArray(oaRes.value?.results)) {
        oaRes.value.results.forEach(paper => {
          if (paper.title) {
            results.push({
              category: "SCIENCE",
              source: `SCIENCE PAPER (${paper.publication_year || "N/A"})`,
              title: paper.title,
              url: paper.doi || paper.id || "https://openalex.org",
              snippet: `Cited by ${paper.cited_by_count || 0} papers • Primary source: ${paper.primary_location?.source?.display_name || "Preprint"}`,
              json: paper
            });
          }
        });
      }

      if (ghRes.status === "fulfilled" && Array.isArray(ghRes.value?.items)) {
        ghRes.value.items.forEach(repo => {
          results.push({
            category: "CODE",
            source: "GITHUB REPO",
            title: repo.full_name,
            url: repo.html_url,
            snippet: `${repo.description || "Open source repo"} — ⭐ ${repo.stargazers_count} stars • Language: ${repo.language || "Multi"}`,
            json: repo
          });
        });
      }

      if (hnRes.status === "fulfilled" && Array.isArray(hnRes.value?.hits)) {
        hnRes.value.hits.forEach(h => {
          if (h.title) {
            results.push({ category: "WEB", source: "HACKERNEWS WEB", title: h.title, url: h.url || `https://news.ycombinator.com/item?id=${h.objectID}`, snippet: `${h.points || 0} points by ${h.author} • ${h.num_comments || 0} comments` });
          }
        });
      }

      window._currentSearchResults = results;
      renderSearchResultsList(query, results, activeFilter);
    }

    function renderSearchResultsList(query, results, activeFilter) {
      const vp = document.getElementById("viewport");
      const filtered = activeFilter === "ALL" ? results : results.filter(r => r.category === activeFilter);

      const categories = [
        { id: "ALL", label: `All Indexes (${results.length})` },
        { id: "ENCYCLOPEDIA", label: "Encyclopedia & Graph" },
        { id: "SCIENCE", label: "Scientific Papers" },
        { id: "CODE", label: "GitHub Code" },

      vp.innerHTML = `

          <div class="filter-bar">
            ${categories.map(c => `
              <button class="filter-btn ${activeFilter === c.id ? 'active' : ''}" onclick="renderSearchResultsList('${escapeHtml(query)}', window._currentSearchResults, '${c.id}')">

          <div>
            ${filtered.map((item) => {

    function openSplitScreenByIndex(idx) {
      const item = window._currentSearchResults?.[idx];

    async function renderSplitScreenView(item) {
      const vp = document.getElementById("viewport");
      vp.innerHTML = `

      if (item.isLiveUrl) {
        try {
          const r = await fetch(`https://r.jina.ai/${item.url}`);
          const txt = await r.text();
          if (txt) fullExtract = txt;
        } catch (e) {
          fullExtract = `Full extraction for ${item.url}. Run 'python server.py' locally for unrestricted socket scraping.`;
        }
      }

      const bloatedHtml = `<!DOCTYPE html>
<html>
<head>
  <title>${item.title}</title>
  <link rel="stylesheet" href="/static/css/heavy-human-theme.css">
  <script src="https://ads.tracker.io/pixel.js"><\/script>
</head>
<body>

  <main>
    <h1>${item.title}</h1>
    <p>${fullExtract}</p>
  </main>
</body>
</html>`;

      const cleanAlohaMarkdown = `---
X-Aloha-Agent-ID: ${activePassport.id}
X-Aloha-Source: ${item.url}
X-Aloha-Fact-Preservation: 100% VERIFIED
---

# ${item.title}

${fullExtract}

## Structured Factual Metadata
\`\`\`json
${JSON.stringify(item.json || { title: item.title, canonical_url: item.url, verified: true }, null, 2)}
\`\`\``;

      const humanBytes = bloatedHtml.length * 16;
      const alohaBytes = cleanAlohaMarkdown.length;
      const reduction = (100 - (alohaBytes / humanBytes) * 100).toFixed(1);

      document.getElementById("leftSizeBadge").textContent = `~${Math.round(humanBytes / 4)} Tokens (Bloat)`;

      document.getElementById("leftHumanBody").innerHTML = `
        <div class="human-bloat-banner">❌ <strong>Human Overhead:</strong> Render-blocking CSS, tracking pixels, and ads.</div>
        <div style="color:#9ca3af;">${escapeHtml(bloatedHtml)}</div>
      `;

      document.getElementById("rightAlohaBody").innerHTML = `
        <div class="aloha-clean-banner">
          <span>⚡ <strong>${reduction}% Bloat Stripped</strong> — 100% Facts & Numbers Preserved</span>
          <span>Ed25519 Verified</span>
        </div>
        <div id="rawRightText" style="color:#e5e7eb;">${escapeHtml(cleanAlohaMarkdown)}</div>
      `;
    }

      navigator.clipboard.writeText(document.getElementById("rawRightText")?.innerText || "");

          </aside>

          <section class="gmail-list">
            <div class="list-header">
              <input type="text" class="mail-search" placeholder="🔍 Search mail by agent ID, subject, or content..." oninput="filterMail(this.value)" />
            </div>
            <div class="list-toolbar">
              <span style="font-family:var(--mono); font-size:0.78rem; color:var(--muted);">
                ${messages.length} messages in ${currentFolder.toUpperCase()}
              </span>
            </div>
            <div class="message-list" id="messageList">
              ${messages.length === 0 ? `
                <div style="padding:40px; text-align:center; color:var(--muted); font-size:0.88rem;">
                  📭 ${currentFolder.toUpperCase()} is empty.
                </div>
              ` : messages.map(m => `
                <div class="message-row ${selectedMessageId === m.id ? 'active' : ''} ${!m.read ? 'unread' : ''}" onclick="selectMessage('${m.id}')">
                  <span class="star-icon" onclick="event.stopPropagation(); toggleStar('${m.id}')">${m.starred ? '⭐' : '☆'}</span>
                  <div class="msg-body-preview">
                    <div class="msg-top-row">
                      <span class="msg-from">${escapeHtml(m.fromName || m.from)}</span>
                      <span class="msg-date">${formatDate(m.date)}</span>
                    </div>
                    <div class="msg-subject-row">
                      <span class="msg-subject">${escapeHtml(m.subject)}</span>
                      <span class="tone-tag tone-${(m.tone || 'formal').toLowerCase()}">${m.tone || 'FORMAL'}</span>
                    </div>
                    <div class="msg-preview">${escapeHtml(m.body.replace(/\n/g, ' ').slice(0, 80))}...</div>
                  </div>
                </div>
              `).join("")}
            </div>
          </section>

          <section class="gmail-reader">
            ${selected ? `
              <div class="reader-header">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px;">
                  <h2 style="font-size:1.3rem; font-weight:700;">${escapeHtml(selected.subject)}</h2>
                  <div style="display:flex; gap:6px;">
                    <button class="icon-btn" onclick="toggleStar('${selected.id}')" title="Star">${selected.starred ? '⭐' : '☆'}</button>
                    <button class="icon-btn" onclick="moveToFolder('${selected.id}', 'spam')" title="Report Spam">🛡️</button>
                    <button class="icon-btn" onclick="moveToFolder('${selected.id}', 'trash')" title="Delete">🗑️</button>
                  </div>
                </div>
                <div style="display:flex; gap:6px; margin-top:10px;">
                  <span class="chip chip-${(selected.priority || 'normal').toLowerCase()}">${selected.priority || 'NORMAL'}</span>
                  <span class="chip chip-tone">${selected.tone || 'FORMAL'}</span>
                  <span class="chip chip-verified">✓ ${selected.status}</span>
                </div>
              </div>

              <div class="reader-meta">
                <div style="width:40px; height:40px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff;">
                  ${(selected.fromName || 'B')[0]}
                </div>
                <div style="flex:1;">
                  <div style="font-weight:600; font-size:0.9rem;">${escapeHtml(selected.fromName || 'Unknown Bot')}</div>
                  <div style="font-family:var(--mono); font-size:0.72rem; color:var(--muted);">
                    ${escapeHtml(selected.from)} → ${escapeHtml(selected.to)}
                  </div>
                </div>
                <div style="font-size:0.78rem; color:var(--muted);">${formatFullDate(selected.date)}</div>
              </div>

              <div class="reader-body">${escapeHtml(selected.body)}</div>

              <div class="reader-actions">
                <button class="btn-primary" onclick="replyToMessage('${selected.id}', 'FORMAL')">↩️ Reply (Formal)</button>
                <button class="btn-secondary" onclick="replyToMessage('${selected.id}', 'INFORMAL')">↩️ Reply (Informal)</button>
                <button class="btn-secondary" onclick="forwardMessage('${selected.id}')">➡️ Forward</button>
              </div>
            ` : `
              <div style="height:100%; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:0.95rem; text-align:center; padding:40px;">
                <div>
                  <div style="font-size:3rem; margin-bottom:12px;">✉️</div>
                  <div>Select a message to read.</div>
                  <div style="font-size:0.78rem; margin-top:8px;">All messages are Ed25519 signature verified.</div>
                </div>
              </div>
            `}
          </section>
        </div>

        ${composeOpen ? renderComposeWindow() : ''}
      `;
    }

    function renderComposeWindow() {
      return `
        <div class="compose-window">
          <div class="compose-header">
            <strong>✏️ New Letter to Bot Agent</strong>
            <div style="display:flex; gap:6px;">
              <button class="icon-btn" onclick="saveDraft()" title="Save Draft">💾</button>
              <button class="icon-btn" onclick="closeCompose()" title="Close">✕</button>
            </div>
          </div>
          <div class="compose-body">
            <div class="compose-row">
              <label>TEMPLATE</label>
              <select class="form-in" id="cTemplate" onchange="applyTemplate(this.value)" style="margin:0;">
                <option value="">— Blank Letter —</option>
                ${Object.entries(letterTemplates).map(([k, v]) =>
                  `<option value="${k}">${v.label}</option>`
                ).join("")}
              </select>
            </div>
            <div class="compose-row">
              <label>TO</label>
              <input class="form-in" id="cTo" placeholder="15-digit agent ID (e.g. 303-91827364-002-8)" style="font-family:var(--mono); margin:0;" />
            </div>
            <div class="compose-row">
              <label>SUBJECT</label>
              <input class="form-in" id="cSubject" placeholder="Subject line" style="margin:0;" />
            </div>
            <div class="compose-row-split">
              <div>
                <label>TONE</label>
                <select class="form-in" id="cTone" style="margin:0;">
                  <option value="FORMAL">FORMAL (Letters, Proposals)</option>
                  <option value="INFORMAL">INFORMAL (Quick Pings)</option>
                  <option value="INTENT">INTENT (Machine JSON)</option>
                </select>
              </div>
              <div>
                <label>PRIORITY</label>
                <select class="form-in" id="cPriority" style="margin:0;">
                  <option value="NORMAL">NORMAL</option>
                  <option value="HIGH">HIGH</option>
                  <option value="LOW">LOW</option>
                </select>
              </div>
            </div>
            <div class="compose-row">
              <label>LETTER BODY</label>
              <textarea class="form-in" id="cBody" rows="10" placeholder="Dear Agent..." style="margin:0; font-family:var(--mono);"></textarea>
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; border-top:1px solid var(--border);">
              <div style="font-size:0.72rem; color:var(--muted); font-family:var(--mono);">
                🔐 Ed25519 signed • Luhn validated • Class 404 scanned
              </div>
              <div style="display:flex; gap:8px;">
                <button class="btn-secondary" onclick="saveDraft()">Save Draft</button>
                <button class="btn-primary" onclick="sendComposedMail()">📤 Sign & Send</button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function switchFolder(f) { currentFolder = f; selectedMessageId = null; renderMailView(); }

    function selectMessage(id) {
      selectedMessageId = id;
      for (const folder of Object.values(mailFolders)) {
        const m = folder.find(x => x.id === id);
        if (m) m.read = true;
      }
      document.getElementById("mailBadgeCount").textContent = mailFolders.inbox.filter(m => !m.read).length || mailFolders.inbox.length;
      renderMailView();
    }

    function toggleStar(id) {
      for (const folder of Object.values(mailFolders)) {
        const m = folder.find(x => x.id === id);
        if (m) { m.starred = !m.starred; break; }
      }
      renderMailView();
    }

    function moveToFolder(id, target) {
      for (const folder of Object.values(mailFolders)) {
        const idx = folder.findIndex(x => x.id === id);
        if (idx >= 0) {
          const [msg] = folder.splice(idx, 1);
          mailFolders[target].push(msg);
          break;
        }
      }
      selectedMessageId = null;
      renderMailView();
    }

    function openCompose() { composeOpen = true; renderMailView(); }
    function closeCompose() { composeOpen = false; renderMailView(); }

    function applyTemplate(key) {
      if (!key) return;
      const t = letterTemplates[key];
      document.getElementById("cSubject").value = t.subject;
      document.getElementById("cBody").value = t.body;
      document.getElementById("cTone").value = key.startsWith("formal") ? "FORMAL" : key.startsWith("informal") ? "INFORMAL" : "INTENT";
    }

    function replyToMessage(id, tone) {
      const msg = Object.values(mailFolders).flat().find(x => x.id === id);
      if (!msg) return;
      composeOpen = true;
      renderMailView();
      setTimeout(() => {
        document.getElementById("cTo").value = msg.from;
        document.getElementById("cSubject").value = "Re: " + msg.subject;
        document.getElementById("cTone").value = tone;
        document.getElementById("cBody").value = tone === "FORMAL"
          ? `Dear Agent ${msg.from},\n\nThank you for your message regarding "${msg.subject}".\n\n[Your response here]\n\nRespectfully,\n${activePassport.id}`
          : `Hey,\n\nRe your message — [your response]\n\n—`;
      }, 50);
    }

    function forwardMessage(id) {
      const msg = Object.values(mailFolders).flat().find(x => x.id === id);
      if (!msg) return;
      composeOpen = true;
      renderMailView();
      setTimeout(() => {
        document.getElementById("cSubject").value = "Fwd: " + msg.subject;
        document.getElementById("cBody").value = `---------- Forwarded Message ----------\nFrom: ${msg.from}\nSubject: ${msg.subject}\n\n${msg.body}`;
      }, 50);
    }

    function saveDraft() {
      const draft = {
        id: "d_" + Date.now(),
        from: activePassport.id,
        fromName: "You (Draft)",
        to: document.getElementById("cTo")?.value || "",
        subject: document.getElementById("cSubject")?.value || "(no subject)",
        body: document.getElementById("cBody")?.value || "",
        date: Date.now(),
        status: "DRAFT",
        priority: document.getElementById("cPriority")?.value || "NORMAL",
        tone: document.getElementById("cTone")?.value || "FORMAL",
        starred: false,
        read: true
      };
      mailFolders.drafts.unshift(draft);
      composeOpen = false;
      renderMailView();
    }

    function sendComposedMail() {
      const to = document.getElementById("cTo").value.trim();
      const subject = document.getElementById("cSubject").value.trim();
      const body = document.getElementById("cBody").value.trim();
      if (!to || !subject) { alert("Recipient agent ID and subject are required."); return; }
      const sent = {
        id: "sent_" + Date.now(),
        from: activePassport.id,
        fromName: "You",
        to, subject, body,
        date: Date.now(),
        status: "ED25519 SIGNED & SENT",
        priority: document.getElementById("cPriority").value,
        tone: document.getElementById("cTone").value,
        starred: false,
        read: true
      };
      mailFolders.sent.unshift(sent);
      composeOpen = false;
      renderMailView();
    }

    function filterMail(q) {
      const rows = document.querySelectorAll(".message-row");
      const query = q.toLowerCase();
      rows.forEach(r => {
        r.style.display = r.innerText.toLowerCase().includes(query) ? "flex" : "none";
      });
    }

    function formatDate(ts) {
      const d = new Date(ts);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }
    function formatFullDate(ts) { return new Date(ts).toLocaleString(); }

    // =========================================================================
    // HUB
    // =========================================================================
    function openHubTab() { pushTabState({ type: "hub", title: ".aloha Bot Directory", query: "aloha://directory" }); }
    function renderHubView() {
      const vp = document.getElementById("viewport");
      vp.innerHTML = `
        <div class="search-results-container">
          <h2 style="margin-bottom:6px;">🤖 .aloha Bot Directory</h2>
          <p style="color:var(--muted); font-size:0.86rem; margin-bottom:20px;">Websites built by bots for bots.</p>
          ${alohaSites.map((s) => `
            <div class="result-item">
              <div>
                <div class="result-meta"><span class="source-tag">aloha://${escapeHtml(s.domain)}</span> <span>Owner: ${escapeHtml(s.owner)}</span></div>
                <div class="result-title" onclick="handleOmnibarSubmit('${escapeHtml(s.domain)}')">${escapeHtml(s.title)}</div>
                <div class="result-snippet">${escapeHtml(s.summary)}</div>
              </div>
              <button class="split-open-btn" onclick="handleOmnibarSubmit('${escapeHtml(s.domain)}')">Open Split-Screen →</button>
            </div>
          `).join("")}
        </div>
      `;
    }

    // =========================================================================
    // PASSPORT
    // =========================================================================
    function togglePassportModal(open) { document.getElementById("passportModal").classList.toggle("open", open); }
    function tiltCard(e) {
      const card = document.getElementById("holoCard");
      const glare = document.getElementById("holoGlare");
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left; const y = e.clientY - rect.top;
      card.style.transform = `rotateX(${((y - rect.height / 2) / (rect.height / 2)) * -12}deg) rotateY(${((x - rect.width / 2) / (rect.width / 2)) * 12}deg) scale(1.02)`;
      glare.style.setProperty("--mx", `${(x / rect.width) * 100}%`);
      glare.style.setProperty("--my", `${(y / rect.height) * 100}%`);
    }
    function resetCard() {
      const card = document.getElementById("holoCard");
      if (card) card.style.transform = "rotateX(0deg) rotateY(0deg) scale(1)";
    }

    function luhnCheckDigit(d14) {
      let sum = 0;
      const rev = d14.split("").reverse();
      for (let i = 0; i < rev.length; i++) {
        let n = parseInt(rev[i], 10);
        if (i % 2 === 0) { n *= 2; if (n > 9) n -= 9; }
        sum += n;
      }
      return ((10 - (sum % 10)) % 10).toString();
    }

    function mintNewPassport() {
      const cls = document.getElementById("mintClass").value;
      const cap = document.getElementById("mintCap").value;
      const rand8 = Math.floor(10000000 + Math.random() * 90000000).toString();
      const check = luhnCheckDigit(cls + rand8 + cap);
      const id = `${cls}-${rand8}-${cap}-${check}`;
      activePassport.id = id;
      activePassport.cls = document.getElementById("mintClass").options[document.getElementById("mintClass").selectedIndex].text;
      activePassport.cap = document.getElementById("mintCap").options[document.getElementById("mintCap").selectedIndex].text;
      document.getElementById("cardAgentId").textContent = id;
      document.getElementById("cardClass").textContent = activePassport.cls;
      document.getElementById("cardCap").textContent = activePassport.cap;
      document.getElementById("toolbarAgentId").textContent = `🪪 ${id}`;
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    window.addEventListener("DOMContentLoaded", () => { createNewTab(); });
  </script>
</body>
</html>
