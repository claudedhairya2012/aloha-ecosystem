<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aloha — AI-Native Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #0a0a0a;
    --elevated: #111111;
    --border: #1f1f1f;
    --border-strong: #2e2e2e;
    --text: #ededed;
    --muted: #8a8a8a;
    --subtle: #5a5a5a;
    --accent: #ffffff;
    --accent-text: #000000;
    --success: #00d47e;
    --danger: #ff4d4d;
    --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 1. REAL BROWSER TAB BAR */
  .tab-bar {
    height: 38px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 4px;
    user-select: none;
    overflow-x: auto;
    position: relative;
  }

  .tab-strip {
    display: flex;
    align-items: center;
    gap: 4px;
    flex: 1;
    overflow-x: auto;
  }

  .tab-strip::-webkit-scrollbar {
    display: none;
  }

  .browser-tab {
    height: 28px;
    min-width: 140px;
    max-width: 220px;
    padding: 0 10px;
    border-radius: 6px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }

  .browser-tab:hover {
    background: var(--surface);
    color: var(--text);
  }

  .browser-tab.active {
    background: var(--elevated);
    border-color: var(--border);
    color: var(--text);
  }

  .tab-title {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    text-align: left;
  }

  .tab-close {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
  }

  .tab-close:hover {
    background: var(--border-strong);
    color: var(--text);
  }

  .new-tab-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }

  .new-tab-btn:hover {
    background: var(--elevated);
    color: var(--text);
    border-color: var(--border);
  }

  /* 2. BROWSER NAVIGATION TOOLBAR & OMNIBAR */
  .nav-toolbar {
    height: 48px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
  }

  .nav-controls {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .icon-btn {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    background: transparent;
    border: none;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .icon-btn:hover:not(:disabled) {
    background: var(--elevated);
    color: var(--text);
  }

  .icon-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .omnibar-form {
    flex: 1;
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    height: 32px;
    padding: 0 12px;
    transition: border-color 0.15s;
  }

  .omnibar-form:focus-within {
    border-color: var(--border-strong);
  }

  .omnibar-input {
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 13px;
    outline: none;
  }

  .omnibar-input::placeholder {
    color: var(--subtle);
  }

  .toolbar-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .pill-btn {
    height: 30px;
    padding: 0 10px;
    border-radius: 6px;
    background: var(--elevated);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .pill-btn:hover {
    border-color: var(--border-strong);
    background: #181818;
  }

  .pill-mono {
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }

  .badge-count {
    background: var(--text);
    color: var(--bg);
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 10px;
  }

  /* 3. MAIN VIEWPORT */
  .viewport {
    flex: 1;
    overflow-y: auto;
    position: relative;
  }

  /* NEW TAB HOME SCREEN */
  .home-screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .home-brand {
    font-size: 36px;
    font-weight: 600;
    letter-spacing: -0.04em;
    margin-bottom: 24px;
    color: var(--text);
    position: relative;
    z-index: 2;
  }

  .home-search-box {
    width: 100%;
    max-width: 580px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px 6px 6px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.15s;
    position: relative;
    z-index: 2;
  }

  .home-search-box:focus-within {
    border-color: var(--border-strong);
  }

  .home-search-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 15px;
    outline: none;
  }

  .home-search-input::placeholder {
    color: var(--subtle);
  }

  .home-search-btn {
    height: 34px;
    padding: 0 14px;
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }

  .home-shortcuts {
    margin-top: 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    position: relative;
    z-index: 2;
  }

  .shortcut-chip {
    padding: 6px 12px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }

  .shortcut-chip:hover {
    color: var(--text);
    border-color: var(--border-strong);
  }

  /* SEARCH RESULTS LIST VIEW */
  .results-container {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 24px 64px;
  }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }

  .result-item {
    padding: 16px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }

  .result-item:hover {
    border-color: var(--border-strong);
  }

  .result-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .result-source-tag {
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--elevated);
    border: 1px solid var(--border);
    color: var(--text);
  }

  .result-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }

  .result-snippet {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }

  /* FLUID RGB BORDER SPLIT-SCREEN COMPARATOR */
  @property --rgb-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  @keyframes spinRgb {
    to {
      --rgb-angle: 360deg;
    }
  }

  .split-screen-wrapper {
    height: calc(100vh - 86px);
    padding: 14px;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .split-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
  }

  .split-rgb-frame {
    flex: 1;
    position: relative;
    border-radius: 12px;
    padding: 1.5px;
    background: conic-gradient(
      from var(--rgb-angle),
      #ff0055,
      #ff9900,
      #00ff88,
      #00ccff,
      #7700ff,
      #ff0055
    );
    animation: spinRgb 6s linear infinite;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5px;
    overflow: hidden;
  }

  .split-pane {
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .split-pane-left {
    border-top-left-radius: 10.5px;
    border-bottom-left-radius: 10.5px;
  }

  .split-pane-right {
    border-top-right-radius: 10.5px;
    border-bottom-right-radius: 10.5px;
  }

  .pane-header {
    height: 40px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 500;
    background: var(--elevated);
  }

  .pane-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  .badge-bloat {
    color: var(--danger);
    background: rgba(255, 77, 77, 0.08);
    border-color: rgba(255, 77, 77, 0.25);
  }

  .badge-clean {
    color: var(--success);
    background: rgba(0, 212, 126, 0.08);
    border-color: rgba(0, 212, 126, 0.25);
  }

  .pane-body {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .pane-body-left {
    color: var(--muted);
  }

  .pane-body-right {
    color: var(--text);
  }

  /* ALOHA MAIL GMAIL-STYLE CLIENT */
  .mail-layout {
    height: calc(100vh - 86px);
    display: grid;
    grid-template-columns: 210px 320px 1fr;
    background: var(--bg);
  }

  .mail-sidebar {
    border-right: 1px solid var(--border);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--surface);
  }

  .compose-btn {
    height: 36px;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 10px;
  }

  .folder-btn {
    height: 32px;
    padding: 0 10px;
    border-radius: 6px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    text-align: left;
  }

  .folder-btn:hover,
  .folder-btn.active {
    background: var(--elevated);
    color: var(--text);
  }

  .mail-list-col {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .mail-search-bar {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  .mail-search-input {
    width: 100%;
    height: 30px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 10px;
    color: var(--text);
    font-size: 12px;
    outline: none;
  }

  .mail-items {
    flex: 1;
    overflow-y: auto;
  }

  .mail-row {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s;
  }

  .mail-row:hover {
    background: var(--surface);
  }

  .mail-row.active {
    background: var(--elevated);
  }

  .mail-row-top {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .mail-row-subj {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mail-row-preview {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .mail-reader {
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  /* 3D HOLOGRAPHIC 15-DIGIT PASSPORT MODAL */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .passport-modal-box {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .perspective-stage {
    perspective: 1100px;
  }

  .holo-card {
    position: relative;
    width: 100%;
    border-radius: 16px;
    padding: 24px;
    background: linear-gradient(135deg, #141414 0%, #080808 55%, #191919 100%);
    border: 1px solid var(--border-strong);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    transform-style: preserve-3d;
    transition: transform 0.12s ease-out;
    overflow: hidden;
  }

  .holo-glare {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      circle at 50% 50%,
      rgba(255, 255, 255, 0.14),
      transparent 60%
    );
    mix-blend-mode: overlay;
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
  }

  .card-chip {
    width: 38px;
    height: 28px;
    border-radius: 5px;
    border: 1px solid #444;
    background: linear-gradient(135deg, #2a2a2a, #121212);
  }

  .card-id-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .card-id-value {
    font-family: var(--font-mono);
    font-size: 23px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text);
    margin-bottom: 22px;
  }

  .card-meta-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    font-size: 11px;
  }

  .meta-k {
    color: var(--muted);
    font-size: 10px;
    margin-bottom: 2px;
  }

  .meta-v {
    font-family: var(--font-mono);
    color: var(--text);
  }

  .passport-controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .control-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .select-input,
  .text-input,
  .textarea-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 12px;
    outline: none;
  }

  /* APPLE-STYLE DYNAMIC TOP NOTCH */
  .dynamic-notch-wrap {
    position: fixed;
    top: 3px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 1200;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  .dynamic-notch {
    pointer-events: auto;
    background: #050505;
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    height: 30px;
    min-width: 126px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
    transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    overflow: hidden;
  }

  .dynamic-notch:hover {
    border-color: #444;
  }

  .dynamic-notch.expanded {
    height: 44px;
    min-width: 470px;
    border-radius: 24px;
    padding: 0 16px;
    background: rgba(10, 10, 10, 0.96);
    backdrop-filter: blur(14px);
  }

  .notch-clock {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
  }

  .notch-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }

  .notch-apps {
    display: none;
    align-items: center;
    gap: 6px;
    margin-left: 8px;
    padding-left: 10px;
    border-left: 1px solid var(--border);
  }

  .dynamic-notch.expanded .notch-apps {
    display: flex;
  }

  .notch-app-btn {
    height: 28px;
    padding: 0 10px;
    border-radius: 14px;
    background: var(--elevated);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }

  .notch-app-btn:hover {
    background: #1d1d1d;
    border-color: var(--border-strong);
  }

  /* SCIENTIFIC CALCULATOR & BOT CALENDAR MODALS */
  .utility-modal-box {
    width: 100%;
    max-width: 350px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
  }

  .calc-screen {
    width: 100%;
    height: 54px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0 12px;
    margin-bottom: 12px;
    font-family: var(--font-mono);
    font-size: 18px;
    color: var(--text);
    text-align: right;
    outline: none;
  }

  .calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
  }

  .calc-key {
    height: 38px;
    border-radius: 6px;
    background: var(--elevated);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }

  .calc-key:hover {
    background: #1c1c1c;
    border-color: var(--border-strong);
  }

  .calc-key.op {
    color: var(--success);
  }

  .calc-key.eq {
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }

  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;

  function createNewTab(initialState) {
    const id = 'tab-' + (tabCounter++);
    const defaultState = initialState || {
      type: 'home',
      title: 'New Tab',
      url: '',
      query: '',
      results: [],
      selectedResult: null
    };
    const newTab = {
      id,
      history: [JSON.parse(JSON.stringify(defaultState))],
      historyIndex: 0
    };
    tabs.push(newTab);
    activeTabId = id;
    renderTabs();
    renderCurrentTabViewport();
  }

  function switchTab(id) {
    activeTabId = id;
    renderTabs();
    renderCurrentTabViewport();
  }

  function closeTab(e, id) {
    e.stopPropagation();
    if (tabs.length === 1) {
      goHomeClean();
      return;
    }
    const idx = tabs.findIndex(t => t.id === id);
    tabs = tabs.filter(t => t.id !== id);
    if (activeTabId === id) {
      const nextTab = tabs[Math.max(0, idx - 1)];
      activeTabId = nextTab.id;
    }
    renderTabs();
    renderCurrentTabViewport();
  }

  function getCurrentTab() {
    return tabs.find(t => t.id === activeTabId);
  }

  function getCurrentState() {
    const tab = getCurrentTab();
    return tab.history[tab.historyIndex];
  }

  function pushTabState(newState) {
    const tab = getCurrentTab();
    tab.history = tab.history.slice(0, tab.historyIndex + 1);
    tab.history.push(JSON.parse(JSON.stringify(newState)));
    tab.historyIndex = tab.history.length - 1;
    renderTabs();
    renderCurrentTabViewport();
  }

  function goBack() {
    const tab = getCurrentTab();
    if (tab.historyIndex > 0) {
      tab.historyIndex--;
      renderTabs();
      renderCurrentTabViewport();
    }
  }

  function goForward() {
    const tab = getCurrentTab();
    if (tab.historyIndex < tab.history.length - 1) {
      tab.historyIndex++;
      renderTabs();
      renderCurrentTabViewport();
    }
  }

  function reloadCurrentTab() {
    const state = getCurrentState();
    if (state.type === 'search' && state.query) {
      executeMultiIndexSearch(state.query, true);
    } else {
      renderCurrentTabViewport();
    }
  }

  function goHomeClean() {
    pushTabState({
      type: 'home',
      title: 'New Tab',
      url: '',
      query: '',
      results: [],
      selectedResult: null
    });
  }

  function renderTabs() {
    const strip = document.getElementById('tabStrip');
    strip.innerHTML = tabs.map(t => {
      const st = t.history[t.historyIndex];
      const activeClass = t.id === activeTabId ? 'active' : '';
      return `
        <div class="browser-tab ${activeClass}" onclick="switchTab('${t.id}')">
          <span class="tab-title">${escapeHtml(st.title || 'New Tab')}</span>
          <button class="tab-close" onclick="closeTab(event, '${t.id}')">×</button>
        </div>
      `;
    }).join('');

    const tab = getCurrentTab();
    if (tab) {
      document.getElementById('btnBack').disabled = tab.historyIndex <= 0;
      document.getElementById('btnForward').disabled = tab.historyIndex >= tab.history.length - 1;
      const st = getCurrentState();
      document.getElementById('omnibarInput').value = st.url || st.query || '';
    }
  }

  async function executeMultiIndexSearch(rawInput, isReload = false) {
    const query = rawInput.trim();
    const query = rawInput.trim().replace(/^aloha:\/\//i, '');

    // Check if native .aloha domain
    const hubMatch = ALOHA_HUB_DOMAINS.find(d => d.domain.toLowerCase() === query.toLowerCase());
    if (hubMatch) {
      const mockHtml = `<!DOCTYPE html>\n<html>\n<head>\n  <title>${hubMatch.title}</title>\n  <script src="analytics-tracker.js"><\/script>\n  <style>.cookie-banner{display:block;padding:40px}</style>\n</head>\n<body>\n  <nav class="navbar">Menu | Login | Subscribe | Ads</nav>\n  <div class="cookie-banner">We use 47 ad-tech trackers to monitor human clicks.</div>\n  <main>\n    <h1>${hubMatch.title}</h1>\n    <p>${hubMatch.summary}</p>\n    <pre>${hubMatch.markdown}</pre>\n  </main>\n  <footer>Copyright 2025. All Rights Reserved.</footer>\n</body>\n</html>`;
      pushTabState({
        type: 'split',
        title: hubMatch.domain,
        url: 'aloha://' + hubMatch.domain,
        query: hubMatch.domain,
        selectedResult: {
          source: '.aloha Native',
          title: hubMatch.title,
          url: 'aloha://' + hubMatch.domain,
          snippet: hubMatch.summary,
          humanHtml: mockHtml,
          alohaMarkdown: hubMatch.markdown
        }
      });
      return;
    }

    if (!isReload) {
      pushTabState({
        type: 'loading',
        title: query,
        url: query,
        query: query,
        results: []
      });
    }

    const results = [];

    // If input looks like a direct URL (https://... or domain.com)
    const looksLikeUrl = /^https?:\/\//i.test(query) || (/^[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(query) && !query.includes(' '));
    if (looksLikeUrl) {
      const targetUrl = /^https?:\/\//i.test(query) ? query : 'https://' + query;
      try {
        const jinaRes = await fetch('https://r.jina.ai/' + targetUrl, {
          headers: { 'Accept': 'text/plain' }
        });
        const mdText = await jinaRes.text();
        const simulatedRawHtml = buildSimulatedRawHtml(targetUrl, targetUrl, mdText);
        pushTabState({
          type: 'split',
          title: targetUrl,
          url: targetUrl,
          query: targetUrl,
          selectedResult: {
            source: 'Live Web Extract',
            title: targetUrl,
            url: targetUrl,
            snippet: mdText.slice(0, 200),
            humanHtml: simulatedRawHtml,
            alohaMarkdown: mdText
          }
        });
        return;
      } catch (err) {
        // Fall through to multi-index search if direct fetch fails
      }
    }

    // Parallel Multi-Index Fetch: Wikipedia + OpenAlex + HackerNews + GitHub + DuckDuckGo
    const tasks = [
      // 1. Wikipedia Full-Text Search
      fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*&srlimit=4`)
        .then(r => r.json())
        .then(data => {
          if (data?.query?.search) {
            data.query.search.forEach(item => {
              const cleanSnippet = item.snippet.replace(/<\/?[^>]+(>|$)/g, '');
              const pageUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(item.title.replace(/ /g, '_'))}`;
              const md = `# ${item.title}\n**Source:** \`${pageUrl}\`\n**Word Count:** ${item.wordcount} | **Page ID:** ${item.pageid}\n\n## Factual Extract\n${cleanSnippet}`;
              results.push({
                source: 'Wikipedia',
                title: item.title,
                url: pageUrl,
                snippet: cleanSnippet,
                humanHtml: buildSimulatedRawHtml(item.title, pageUrl, cleanSnippet),
                alohaMarkdown: md
              });
            });
          }
        }).catch(() => {}),

      // 2. OpenAlex Scientific Papers
      fetch(`https://api.openalex.org/works?search=${encodeURIComponent(query)}&per-page=3`)
        .then(r => r.json())
        .then(data => {
          if (data?.results) {
            data.results.forEach(work => {
              const title = work.title || 'Untitled Research Work';
              const year = work.publication_year || 'N/A';
              const citations = work.cited_by_count ?? 0;
              const url = work.doi || work.id || 'https://openalex.org';
              const snippet = `Published: ${year} • Citations: ${citations} • Type: ${work.type || 'article'}`;
              const md = `# ${title}\n**Source:** \`${url}\`\n\n| Metric | Value |\n| --- | --- |\n| Publication Year | ${year} |\n| Cited By Count | ${citations} |\n| OpenAlex ID | ${work.id} |\n`;
              results.push({
                source: 'OpenAlex',
                title: title,
                url: url,
                snippet: snippet,
                humanHtml: buildSimulatedRawHtml(title, url, snippet),
                alohaMarkdown: md
              });
            });
          }
        }).catch(() => {}),

      // 3. HackerNews Algolia Index
      fetch(`https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(query)}&tags=story&hitsPerPage=3`)
        .then(r => r.json())
        .then(data => {
          if (data?.hits) {
            data.hits.forEach(hit => {
              const title = hit.title || 'HN Discussion';
              const url = hit.url || `https://news.ycombinator.com/item?id=${hit.objectID}`;
              const snippet = `Points: ${hit.points || 0} • Comments: ${hit.num_comments || 0} • Author: ${hit.author}`;
              const md = `# ${title}\n**Source:** \`${url}\`\n\n- **Points:** ${hit.points || 0}\n- **Comments:** ${hit.num_comments || 0}\n- **Author:** \`${hit.author}\`\n- **Created At:** ${hit.created_at}`;
              results.push({
                source: 'HackerNews',
                title: title,
                url: url,
                snippet: snippet,
                humanHtml: buildSimulatedRawHtml(title, url, snippet),
                alohaMarkdown: md
              });
            });
          }
        }).catch(() => {}),

      // 4. GitHub Repositories
      fetch(`https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&per_page=2`)
        .then(r => r.json())
        .then(data => {
          if (data?.items) {
            data.items.forEach(repo => {
              const title = repo.full_name;
              const url = repo.html_url;
              const snippet = `${repo.description || 'No description'} (★ ${repo.stargazers_count} | Forks: ${repo.forks_count} | Lang: ${repo.language || 'N/A'})`;
              const md = `# ${repo.full_name}\n**Repository:** \`${url}\`\n\n${repo.description || ''}\n\n| Metric | Count |\n| --- | --- |\n| Stars | ${repo.stargazers_count} |\n| Forks | ${repo.forks_count} |\n| Language | ${repo.language || 'N/A'} |`;
              results.push({
                source: 'GitHub',
                title: title,
                url: url,
                snippet: snippet,
                humanHtml: buildSimulatedRawHtml(title, url, snippet),
                alohaMarkdown: md
              });
            });
          }
        }).catch(() => {})
    ];

    await Promise.allSettled(tasks);

    // Update current tab state with results
    const tab = getCurrentTab();
    tab.history[tab.historyIndex] = {
      type: 'search',
      title: query + ' — Aloha Search',
      url: query,
      query: query,
      results: results,
      selectedResult: null
    };
    renderTabs();
    renderCurrentTabViewport();
  }

  async function synthesizeParserOutput(item, state) {
    const rightEl = document.getElementById('rightAlohaBody');
    const rawStore = document.getElementById('rawRightText');
    if (!rightEl || !rawStore) return;

    // Gather factual context from the selected page + sibling extracts on the same query
    const relatedFacts = (state.results || [])
      .slice(0, 4)
      .map(r => `[${r.source}] ${r.title}: ${r.snippet}`)
      .join('\n');

    const userQuery = state.query || item.title;
    const prompt = `Based strictly on the extracted webpage data below for "${userQuery}", formulate a direct, comprehensive factual answer (3 to 5 sentences) followed by key bullet points preserving all numbers, dates, and technical facts. Do not use conversational filler.\n\nPRIMARY PAGE EXTRACT:\n${item.alohaMarkdown}\n\nCORROBORATING EXTRACTS:\n${relatedFacts}`;

    try {
      const res = await fetch('https://text.pollinations.ai/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [
            {
              role: 'system',
              content: 'You are the core synthesis engine of a factual parser. Output direct, high-density Markdown answers grounded strictly in the extracted source data.'
            },
            { role: 'user', content: prompt }
          ],
          model: 'openai',
          seed: 42
        })
      });

      if (res.ok) {
        const answer = (await res.text()).trim();
        if (answer && answer.length > 25 && !answer.toLowerCase().includes('<html')) {
          const combinedMarkdown = `## Direct Synthesis\n${answer}\n\n---\n\n${item.alohaMarkdown}`;
          item.synthesizedMarkdown = combinedMarkdown;
          if (document.getElementById('rightAlohaBody')) {
            document.getElementById('rightAlohaBody').textContent = combinedMarkdown;
          }
          if (document.getElementById('rawRightText')) {
            document.getElementById('rawRightText').value = combinedMarkdown;
          }
        }
      }
    } catch (e) {}
  }

  async function renderSplitScreenView(state) {
    const viewport = document.getElementById('viewport');
    const item = state.selectedResult;
    const rawChars = item.humanHtml.length;
    const activeMd = item.synthesizedMarkdown || item.alohaMarkdown;
    const mdChars = activeMd.length;
    const savingsPct = Math.max(55, Math.min(94, Math.round((1 - mdChars / Math.max(rawChars, mdChars * 3.4)) * 100)));

    viewport.innerHTML = `
      <div class="split-screen-wrapper">

          </div>
        </div>
      </div>

    `;

    // If Wikipedia item, enrich with live REST Summary API
    if (item.source === 'Wikipedia' && !item.enriched) {
      try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(item.title)}`);
        const sumData = await res.json();
        if (sumData?.extract) {
          const fullMd = `# ${sumData.title}\n**Canonical URI:** \`${item.url}\`\n**Description:** ${sumData.description || 'Verified Encyclopedia Entry'}\n\n## Factual Summary\n${sumData.extract}\n\n## Metadata Ledger\n| Field | Value |\n| --- | --- |\n| Page ID | ${sumData.pageid || 'N/A'} |\n| Revision | ${sumData.tid || 'Latest'} |\n| Coordinates | ${sumData.coordinates ? sumData.coordinates.lat + ', ' + sumData.coordinates.lon : 'N/A'} |`;
          item.alohaMarkdown = fullMd;
          item.enriched = true;
          const rightEl = document.getElementById('rightAlohaBody');
          const rawStore = document.getElementById('rawRightText');
          if (rightEl && !item.synthesizedMarkdown) rightEl.textContent = fullMd;
          if (rawStore && !item.synthesizedMarkdown) rawStore.value = fullMd;
        }
      } catch (e) {}
    }

    // Run native parser answer synthesis if not already synthesized for this item
    if (!item.synthesizedMarkdown) {
      synthesizeParserOutput(item, state);
    }
  }

  function applyTemplate(key) {

  function replyToMessage(id, tone) {
    const orig = mailMessages.find(x => x.id === id);
    if (!orig) return;
    mailState.composing = true;
    const prefix = tone === 'Formal'
      ? `Regarding your signed transmission (${orig.signature}):\n\nACK confirmed by Agent ${currentPassport.id}.\n\n`
      : `Hey! Got your message — here's my quick reply from ${currentPassport.id}:\n\n`;
    mailState.composeDraft = {
      to: orig.from,
      subject: orig.subject.startsWith('Re:') ? orig.subject : 'Re: ' + orig.subject,
      tone: tone,
      priority: orig.priority,
      body: prefix + '> ' + orig.body.split('\n').join('\n> ')
    };
    renderMailView();
  }

  function forwardMessage(id) {
    const orig = mailMessages.find(x => x.id === id);
    if (!orig) return;
    mailState.composing = true;
    mailState.composeDraft = {
      to: '',
      subject: 'Fwd: ' + orig.subject,
      tone: orig.tone,
      priority: orig.priority,
      body: `--- Forwarded Ed25519 Signed Message ---\nFrom: ${orig.from}\nSignature: ${orig.signature}\n\n${orig.body}`
    };
    renderMailView();
  }

      timestamp: Date.now(),

    };

  function verifyLuhn15(formattedId) {
    const digits = String(formattedId || '').replace(/-/g, '');
    if (!/^\d{15}$/.test(digits)) return false;
    const expected = luhnCheckDigit(digits.slice(0, 14));
    return parseInt(digits[14], 10) === expected;
  }

  async function registerNewBotNode(e) {
    e.preventDefault();
    let domainInput = document.getElementById('regBotDomain').value.trim().toLowerCase();
    const agentIdInput = document.getElementById('regBotPassport').value.trim();
    const titleInput = document.getElementById('regBotTitle').value.trim();
    const summaryInput = document.getElementById('regBotSummary').value.trim();

    if (!domainInput.endsWith('.aloha')) {
      domainInput = domainInput.replace(/[^a-z0-9-]/g, '') + '.aloha';
    }

    if (!verifyLuhn15(agentIdInput)) {
      hubFormNotice = 'Class 404 Firewall Rejected: Invalid 15-Digit Luhn Mod-10 Checksum.';
      renderHubView();
      return;
    }

    const pubKeyHex = Array.from({length: 32}, () => Math.floor(Math.random()*16).toString(16)).join('');
    const manifestJson = JSON.stringify({
      protocol: 'aloha/1.0',
      domain: domainInput,
      agent_id: agentIdInput,
      public_key: 'ed25519:' + pubKeyHex,
      firewall: 'Class 404 Verified',
      registered_at: new Date().toISOString()
    }, null, 2);

    const newBotNode = {
      domain: domainInput,
      agentId: agentIdInput,
      title: titleInput || (domainInput + ' Autonomous Agent Node'),
      summary: summaryInput || 'Verified autonomous bot registered on the .aloha cryptographic mesh.',
      markdown: `# ${titleInput || domainInput}\n**Domain:** \`aloha://${domainInput}\`\n**15-Digit Agent Passport:** \`${agentIdInput}\`\n**Class 404 Firewall:** \`VERIFIED\`\n\n## Capabilities & Summary\n${summaryInput}\n\n## Open Web Discovery Manifest (\`/.well-known/aloha.json\`)\n\`\`\`json\n${manifestJson}\n\`\`\``
    };

    ALOHA_HUB_DOMAINS = ALOHA_HUB_DOMAINS.filter(d => d.domain.toLowerCase() !== domainInput);
    ALOHA_HUB_DOMAINS.unshift(newBotNode);

    // Send signed onboarding certificate to Aloha Mail Inbox
    mailMessages.unshift({
      id: 'msg-' + Date.now(),
      folder: 'inbox',
      starred: true,
      from: '404-00000001-999-8 (protocol.aloha)',
      to: agentIdInput,
      subject: `[ONBOARDED] ${domainInput} Verified on Aloha Ecosystem`,
      tone: 'Formal',
      priority: 'High',
      timestamp: Date.now(),
      signature: 'ed25519:' + pubKeyHex,
      body: `Welcome to the Aloha Ecosystem, Agent ${agentIdInput}!\n\nYour bot domain aloha://${domainInput} has passed the Class 404 Cognitive Firewall (Luhn Mod-10 + Ed25519 verification) and is now live in the .aloha Bot Hub and searchable via the browser Omnibar.\n\nGenerated Manifest:\n${manifestJson}`
    });

    persistDatabase();

    // Sync with local Python SQLite server if running
    try {
      fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          agent_id: agentIdInput,
          domain: domainInput,
          public_key: 'ed25519:' + pubKeyHex
        })
      }).catch(() => {});
    } catch (err) {}

    const badgeEl = document.getElementById('mailBadgeCount');
    if (badgeEl) {
      badgeEl.textContent = mailMessages.filter(m => m.folder === 'inbox').length;
    }

    hubFormOpen = false;
    hubFormNotice = `Bot node aloha://${domainInput} verified & added to ecosystem!`;
    renderHubView();
  }

  /********************************************************************
   * 3D HOLOGRAPHIC 15-DIGIT PASSPORT & LUHN MOD-10 GENERATOR
   ********************************************************************/
  function togglePassportModal(open) {
    const modal = document.getElementById('passportModal');
    if (open) modal.classList.add('open');
    else modal.classList.remove('open');
  }

  function tiltCard(e) {
    const card = document.getElementById('holoCard');
    const glare = document.getElementById('holoGlare');
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const rotY = ((x - cx) / cx) * 12;
    const rotX = -((y - cy) / cy) * 12;
    card.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    const px = Math.round((x / rect.width) * 100);
    const py = Math.round((y / rect.height) * 100);
    glare.style.background = `radial-gradient(circle at ${px}% ${py}%, rgba(255,255,255,0.22), transparent 60%)`;
  }

  function resetCard() {
    const card = document.getElementById('holoCard');
    card.style.transform = 'rotateX(0deg) rotateY(0deg)';
  }

  function luhnCheckDigit(digits14) {
    let sum = 0;
    for (let i = 0; i < digits14.length; i++) {
      let d = parseInt(digits14[digits14.length - 1 - i], 10);
      if (i % 2 === 0) {
        d *= 2;
        if (d > 9) d -= 9;
      }
      sum += d;
    }
    return (10 - (sum % 10)) % 10;
  }

  function mintNewPassport() {
    const cls = document.getElementById('mintClass').value;
    const cap = document.getElementById('mintCap').value;
    let entropy = '';
    for (let i = 0; i < 8; i++) {
      entropy += Math.floor(Math.random() * 10).toString();
    }
    const raw14 = cls + entropy + cap;
    const check = luhnCheckDigit(raw14);
    const formatted = `${cls}-${entropy}-${cap}-${check}`;

    currentPassport = { id: formatted, classCode: cls, capCode: cap };
    persistDatabase();

    document.getElementById('cardAgentId').textContent = formatted;
    document.getElementById('toolbarAgentId').textContent = formatted;
    document.getElementById('cardClass').textContent = cls;
    document.getElementById('cardCap').textContent = cap;
  }

  function escapeHtml(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /********************************************************************
   * DYNAMIC NOTCH, SCIENTIFIC CALCULATOR, BOT CALENDAR & PARTICLES
   ********************************************************************/
  function updateNotchTime() {
    const now = new Date();
    const t = now.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
    const el = document.getElementById('notchTime');

    const ep = document.getElementById('calEpoch');
    const iso = document.getElementById('calIso');
    if (ep) ep.textContent = Math.floor(now.getTime() / 1000) + 's';
    if (iso) iso.textContent = now.toISOString();
  }
  setInterval(updateNotchTime, 1000);
  updateNotchTime();

  function toggleNotch(e) {
    if (e) e.stopPropagation();

    if (n) n.classList.toggle('expanded');

  document.addEventListener('click', (e) => {
    const n = document.getElementById('dynamicNotch');

  function toggleCalcModal(open) {
    const m = document.getElementById('calcModal');

    else m.classList.remove('open');

  function calcAppend(val) {
    const d = document.getElementById('calcDisplay');
    if (d.value === '0' || d.value === 'Error') d.value = val;
    else d.value += val;
  }

  function calcClear() {
    document.getElementById('calcDisplay').value = '0';
  }

  function calcDel() {
    const d = document.getElementById('calcDisplay');
    d.value = d.value.length > 1 ? d.value.slice(0, -1) : '0';
  }

  function calcEval() {
    const d = document.getElementById('calcDisplay');
    try {
      const res = Function('"use strict";return (' + d.value + ')')();
      d.value = Number.isFinite(res) ? String(Number(res.toPrecision(10))) : 'Error';
    } catch (e) {
      } catch (e) {
      d.value = 'Error';
    }
  }

  function toggleCalendarModal(open) {
    const m = document.getElementById('calendarModal');
    if (open) {
      renderCalendar();
      m.classList.add('open');
    } else {
      m.classList.remove('open');
    }
  }

  function renderCalendar() {
    const grid = document.getElementById('calGrid');
    if (!grid) return;
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const today = now.getDate();
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    const headers = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(d => `<div class="cal-cell">${d}</div>`).join('');
    let cells = '';
    for (let i = 0; i < firstDay; i++) cells += `<div class="cal-cell"></div>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const cls = d === today ? 'cal-cell day today' : 'cal-cell day';
      cells += `<div class="${cls}">${d}</div>`;
    }
    grid.innerHTML = headers + cells;
  }

  let particleReqId = null;
  function initFrontParticles() {
    if (particleReqId) cancelAnimationFrame(particleReqId);
    const canvas = document.getElementById('frontParticles');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w = canvas.width = canvas.offsetWidth || window.innerWidth;
    let h = canvas.height = canvas.offsetHeight || window.innerHeight;

    const particles = Array.from({ length: 46 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.55,
      vy: (Math.random() - 0.5) * 0.55,
      r: Math.random() * 1.8 + 0.8,
      a: Math.random() * 0.45 + 0.15
    }));

    let mouse = { x: -9999, y: -9999 };
    const parent = canvas.parentElement;
    if (parent) {
      parent.onmousemove = (e) => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
      };
      parent.onmouseleave = () => {
        mouse.x = -9999;
        mouse.y = -9999;
      };
    }

    function step() {
      if (!document.getElementById('frontParticles')) return;
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) {
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 90 && dist > 0) {
          p.x += (dx / dist) * 2.1;
          p.y += (dy / dist) * 2.1;
        }
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = w;
        if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h;
        if (p.y > h) p.y = 0;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${p.a})`;
        ctx.fill();
      }
      particleReqId = requestAnimationFrame(step);
    }
    step();
  }

  // Sync hydrated passport to UI & Boot Initial Browser Tab
  document.getElementById('cardAgentId').textContent = currentPassport.id;
  document.getElementById('toolbarAgentId').textContent = currentPassport.id;
  document.getElementById('cardClass').textContent = currentPassport.classCode;
  document.getElementById('cardCap').textContent = currentPassport.capCode;
  document.getElementById('mailBadgeCount').textContent = mailMessages.filter(m => m.folder === 'inbox').length;
  createNewTab();
</script>
